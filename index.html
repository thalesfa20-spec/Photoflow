<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Galeria de Fotos</title>
<style>
:root{--bg:#0b0f1a;--card:#111827;--card2:#172033;--bd:rgba(255,255,255,.08);--tx:#f3f4f6;--mut:#8b93a7;--ac:#6366f1;--ac2:#818cf8;--ok:#34d399;--warn:#f5b84b;--bad:#f87171;--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
[data-theme=light]{--bg:#f4f5f9;--card:#ffffff;--card2:#eef0f6;--bd:rgba(15,23,42,.1);--tx:#0f172a;--mut:#64748b;--sh:0 10px 30px rgba(15,23,42,.1);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1500px;margin:0 auto;padding:0 28px}
.top{display:flex;align-items:flex-start;gap:14px;padding:26px 0 18px}
.top .tt{flex:1;min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
h1{overflow-wrap:anywhere;margin:4px 0 0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.sub{margin-top:8px;font-size:13px;color:var(--mut);line-height:1.5}
.sub b{color:var(--tx);font-weight:600}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;flex:none}
@media (hover:hover){.ibtn:hover{border-color:var(--ac)}}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 18px;border-bottom:1px solid var(--bd)}
.pill{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600}
.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 0 120px}
.pills .br{flex-basis:100%;height:0}.pill.pa{font-weight:500}
.gh{grid-column:1/-1;font-size:15px;font-weight:700;padding:8px 2px 0}.gh small{color:var(--mut);font-weight:500;margin-left:6px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.wrap{padding:0 14px}h1{font-size:23px}.top{padding-top:18px}}
.ph{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--card);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.on{outline:3px solid var(--ac);outline-offset:-3px}
.acts{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.rb{width:38px;height:38px;border-radius:50%;border:0;background:rgba(15,18,30,.72);color:#fff;display:grid;place-items:center}
@media (hover:hover){.rb:hover{background:rgba(15,18,30,.85)}}
.rb.fav.on{background:#ef4444}.rb.fav.on svg{fill:#fff}
.rb.sel.on{background:var(--ac)}
.rb.com.on{background:var(--warn);color:#111}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.bar .wrap{display:flex;align-items:center;gap:16px}
.bar .inf{flex:1;min-width:0}.bar .inf b{display:block;font-size:15px}.bar .inf small{color:var(--mut);font-size:12.5px}
.btn{border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;padding:12px 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 20px}
@media(max-width:700px){.stats{gap:8px}}
.stat{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px}
.stat .ico{width:42px;height:42px;border-radius:12px;background:rgba(99,102,241,.14);color:var(--ac2);display:grid;place-items:center}
.stat small{display:block;color:var(--mut);font-size:12.5px}.stat b{font-size:24px}
.aviso{display:flex;align-items:center;gap:14px;border:1px solid;border-radius:14px;padding:14px 18px;margin-bottom:12px}
.aviso .t{flex:1;min-width:0}.aviso b{display:block;font-size:14px}.aviso span{font-size:13px;color:var(--mut)}
.aviso.ok{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08);color:var(--ok)}
.aviso.novo{border-color:rgba(99,102,241,.45);background:rgba(99,102,241,.1);color:var(--ac2)}
.aviso.alerta{border-color:rgba(245,184,75,.45);background:rgba(245,184,75,.08);color:var(--warn)}
.aviso b{color:var(--tx)}
.aviso .x{background:none;border:0;color:var(--mut);padding:4px}
h2{font-size:18px;margin:26px 0 14px}
.gals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:18px;padding-bottom:60px}
.gcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%}
@media (hover:hover){.gcard:hover{border-color:var(--ac);transform:translateY(-2px);transition:.15s}}
.gcard .cv{aspect-ratio:4/5;background:var(--card2);overflow:hidden}
.gcard .cv img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .in{padding:14px 16px 16px}
.gcard b{display:block;font-size:16px}
.gcard small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin:8px 6px 0 0;background:rgba(99,102,241,.15);color:var(--ac2)}
.tag.ok{background:rgba(52,211,153,.15);color:var(--ok)}.tag.warn{background:rgba(245,184,75,.15);color:var(--warn)}.tag.bad{background:rgba(248,113,113,.15);color:var(--bad)}
.msg{text-align:center;padding:90px 20px;color:var(--mut)}.msg h2{color:var(--tx);margin:0 0 8px}
.lb{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;background:rgba(5,7,12,.96);z-index:50;display:none;flex-direction:column;overscroll-behavior:contain;-webkit-user-select:none;user-select:none}
.lb.on{display:flex}
.lb .st{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:56px 56px 8px;overflow:hidden;touch-action:none}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;transform-origin:center center;will-change:transform;pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.lb .nv.l{left:10px}.lb .nv.r{right:10px}
.lb .cl{position:absolute;top:10px;right:10px}.lb .ct{position:absolute;top:18px;left:18px;color:#cbd5e1;font-size:13px}
.lb .ft{display:flex;justify-content:center;gap:12px;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.lb .ft .rb{width:46px;height:46px;background:rgba(255,255,255,.14)}
.lb a.rb{text-decoration:none}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;overscroll-behavior:contain;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.mo.on{display:flex}
.md{background:var(--card);border:1px solid var(--bd);border-radius:18px;max-width:520px;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:22px;box-shadow:var(--sh)}
.md h3{margin:0 0 4px;font-size:20px}.md p{color:var(--mut);font-size:13.5px;margin:4px 0 14px;line-height:1.5}
.md textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:12px;font:inherit;font-size:16px;resize:vertical}
.rowb{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sum{display:grid;gap:8px;background:var(--card2);border-radius:12px;padding:14px;margin:10px 0}
.sum div{display:flex;justify-content:space-between;font-size:14px}.sum .tot{font-weight:800;font-size:16px;border-top:1px solid var(--bd);padding-top:8px}
.pix{background:var(--card2);border:1px dashed var(--ac);border-radius:12px;padding:14px;margin:10px 0;font-size:13.5px}
.pix code{display:block;word-break:break-all;font-size:15px;margin:6px 0 10px;color:var(--ac2)}
.pix pre{white-space:pre-wrap;font:inherit;color:var(--mut);margin:10px 0 0}
.pix img{display:block;max-width:190px;border-radius:10px;margin:10px auto 0;background:#fff;padding:6px}
.cm{border-bottom:1px solid var(--bd);padding:8px 0;font-size:13.5px}.cm small{display:block;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;border:1px solid rgba(255,255,255,.12);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:90;display:none}
.toast.on{display:block}
.ban{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.4);color:var(--ok);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-size:13.5px}
.ph img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){.rb{width:42px;height:42px}.acts{gap:6px;right:8px;bottom:8px}.ibtn{width:44px;height:44px}.pill{padding:10px 14px}}
@media (hover:none){.lb .nv{display:none}.lb .st{padding:48px 0 0}}
@media(max-width:700px){.stat{padding:12px;gap:8px}.stat .ico{display:none}.stat b{font-size:20px}.aviso{padding:12px 14px}.bar .wrap{gap:10px}.bar .btn{padding:12px 16px;white-space:nowrap}.md{padding:18px}}
@supports not (aspect-ratio:1/1){.ph{height:0;padding-top:150%}.ph img{position:absolute;top:0;left:0}.gcard .cv{height:0;padding-top:125%;position:relative}.gcard .cv img{position:absolute;top:0;left:0}}
/* ===== PHOTOFLOW-FIX v2 ===== */
html{touch-action:manipulation}
.ph,.acts,.rb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lb{background:#05070c}
.lb .ft .rb.sel.on,.lb .rb.sel.on{background:var(--ac);color:#fff}
.lb .ft .rb.fav.on,.lb .rb.fav.on{background:#ef4444;color:#fff}
.lb .ft .rb.fav.on svg{fill:#fff}
.lb .ft .rb.com.on,.lb .rb.com.on{background:var(--warn);color:#111}
.lb .cl{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.lb .ct{top:calc(18px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px));max-width:calc(100% - 90px)}
@media (hover:none){.lb .st{padding-top:calc(48px + env(safe-area-inset-top,0px))}}
.ph.on::after{content:'\2713';position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;pointer-events:none}
.wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
@media(max-width:700px){.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}}
.mo{overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:flex-start}
.md{margin:auto}
.toast{max-width:calc(100vw - 32px);text-align:center;bottom:calc(90px + env(safe-area-inset-bottom,0px))}
@media (pointer:coarse){.rb{width:44px;height:44px}.acts{gap:6px}.bar .btn{min-height:46px}}
/* ===== /PHOTOFLOW-FIX v2 ===== */
/* ===== PHOTOFLOW-FIX v3 (extras, pagamento, celular) ===== */
.grid{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.ph{contain:layout paint;background:var(--card2)}
.bar{box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.bar.ex{border-top-color:var(--warn)}
.bar .inf .xt{display:block;font-size:14px;font-weight:700;color:var(--warn);margin-top:2px}
.bar .inf .xt small{color:var(--mut);font-weight:500;font-size:12px}
.bar .inf .xt b{font-size:16px;white-space:nowrap}
.toast{bottom:calc(125px + env(safe-area-inset-bottom,0px))}
.btn{min-height:44px;-webkit-user-select:none;user-select:none}
.btn.busy{opacity:.7;pointer-events:none}
.pill{min-height:40px}
.pg{background:var(--card2);border:1px solid var(--ac);border-radius:14px;padding:14px;margin:12px 0}
.pg .pgh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pg .pgh b{font-size:14px}
.pg .pgt{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;color:var(--ok);background:rgba(52,211,153,.12);padding:4px 10px;border-radius:99px}
.pg .pgt.low{color:var(--bad);background:rgba(248,113,113,.14)}
.pg .pgv{font-size:28px;font-weight:800;text-align:center;margin:10px 0 4px}
.pg .pgq{display:grid;place-items:center;min-height:200px;margin:6px 0}
.pg .pgq svg{width:min(240px,70vw);height:auto;border-radius:12px;display:block;fill:none;stroke:none}   /* o svg{} geral da pagina tem traco (stroke) e estragaria o QR */
.pg .pgq .ld{color:var(--mut);font-size:13.5px;text-align:center}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--ac);animation:giro .8s linear infinite;margin:0 auto 8px}
@keyframes giro{to{transform:rotate(360deg)}}
.pg .pga{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 2px}
.pg .pga .btn{padding:10px 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.pg .pgk{border-top:1px dashed var(--bd);margin-top:12px;padding-top:10px;font-size:13.5px}
.pg .pgk code{display:block;word-break:break-all;font-size:15px;margin:6px 0 8px;color:var(--ac2)}
.pg .pgk pre{white-space:pre-wrap;font:inherit;color:var(--mut);margin:8px 0 0}
.pg .pgd{font-size:12.5px;color:var(--mut);text-align:center;margin-top:8px;line-height:1.45}
.pg .pgx{text-align:center;color:var(--bad);font-size:14px;line-height:1.5}
.md{--mp:22px}@media(max-width:700px){.md{--mp:18px}}
.md .rowb.fix{position:sticky;bottom:calc(-1 * var(--mp));margin:16px calc(-1 * var(--mp)) calc(-1 * var(--mp));padding:12px var(--mp) calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:2}
/* ===== /PHOTOFLOW-FIX v3 ===== */
</style>

<body>
<div id="app"><div class="msg"><h2>Carregando…</h2></div></div>
<div class="lb" id="lb"></div>
<div class="mo" id="mo"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var P = new URLSearchParams(location.search);
  var TC = P.get('c') || '';
  var TG = P.get('g') || '';
  var PAGO = null;   // voltou da InfinitePay depois de pagar
  if (P.get('transaction_nsu') || P.get('receipt_url')) {
    PAGO = { recibo: P.get('receipt_url') || '', metodo: P.get('capture_method') || '' };
    try { history.replaceState({}, '', location.pathname + '?' + (TC ? 'c=' + encodeURIComponent(TC) + '&' : '') + 'g=' + encodeURIComponent(TG)); } catch (e) { }
  }

  // ------------------------------------------------------------------ MODO NUVEM (Google Drive + Apps Script)
  // Se a página foi gerada pelo PhotoFlow para a nuvem, window.NUVEM_URL aponta para o script; senão tudo funciona como antes (servidor no PC).
  var NV = String(window.NUVEM_URL || '').replace(/\s+/g, '');
  var NV_IDS = {}, NV_CAPA = {};
  function nuvemFoto(nome, baixar, grande) {
    var id = (NV_IDS[TG] || {})[nome]; if (!id) return '';
    if (baixar) return 'https://drive.google.com/uc?export=download&id=' + id;
    return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (grande ? 1600 : (window.innerWidth <= 700 ? 480 : 700));
  }
  function nuvemCapa(token) { var id = NV_CAPA[token]; return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w800' : ''; }
  if (NV) {
    var fetchNativo = window.fetch.bind(window);
    window.fetch = function (url, opts) {
      if (typeof url !== 'string' || url.indexOf('/api/galeria/') !== 0) return fetchNativo(url, opts);
      var u = new URL(url, location.href), acao = u.pathname.replace('/api/galeria/', '');
      var g = u.searchParams.get('g') || '', c = u.searchParams.get('c') || '';
      var req;
      if (opts && opts.method === 'POST') {
        var corpo = {}; try { corpo = JSON.parse(opts.body || '{}'); } catch (e) { }
        corpo.action = acao; corpo.g = g;
        var corpoTxt = JSON.stringify(corpo);
        req = fetchNativo(NV, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: corpoTxt, keepalive: !!(opts && opts.keepalive) && corpoTxt.length < 60000 });
      } else {
        req = fetchNativo(NV + (NV.indexOf('?') < 0 ? '?' : '&') + 'action=' + encodeURIComponent(acao) + (g ? '&g=' + encodeURIComponent(g) : '') + (c ? '&c=' + encodeURIComponent(c) : '') + '&_=' + Date.now());
      }
      return req.then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.fotos && j.fotoIds) { var m = {}; j.fotos.forEach(function (n, i) { m[n] = j.fotoIds[i]; }); NV_IDS[g] = m; }
        if (j && j.galerias) j.galerias.forEach(function (x) { if (x.capaId) NV_CAPA[x.token] = x.capaId; });
        var ok = !(j && j.erro);
        return new Response(JSON.stringify(j), { status: ok ? 200 : (j.status || 400), headers: { 'Content-Type': 'application/json' } });
      });
    };
    // Google às vezes recusa miniaturas quando vêm muitas de uma vez: tenta o endereço alternativo e depois mais uma vez
    document.addEventListener('error', function (e) {
      var im = e.target; if (!im || im.tagName !== 'IMG' || !/drive\.google\.com\/thumbnail/.test(im.src || '')) return;
      var id = (/[?&]id=([^&]+)/.exec(im.src) || [])[1], sz = (/[?&]sz=w(\d+)/.exec(im.src) || [])[1] || '800', fase = im.getAttribute('data-fb') || '0';
      if (!id) return;
      if (fase === '0') { im.setAttribute('data-fb', '1'); im.src = 'https://lh3.googleusercontent.com/d/' + id + '=w' + sz; }
      else if (fase === '1') { im.setAttribute('data-fb', '2'); setTimeout(function () { im.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + sz + '&r=' + Date.now(); }, 2500); }
    }, true);
  }
  // ---- Gerador de QR Code (byte, versões 1-10, correção L/M) - sem internet, sem biblioteca externa
  var PFQR = (function () {
    var ECC = { L: [7, 10, 15, 20, 26, 18, 20, 24, 30, 18], M: [10, 16, 26, 18, 24, 16, 18, 22, 22, 26] };
    var BLK = { L: [1, 1, 1, 1, 1, 2, 2, 2, 2, 4], M: [1, 1, 1, 2, 2, 4, 4, 4, 5, 5] };
    var FMT = { L: 1, M: 0 };
    var EXP = [], LOG = [];
    (function () { var x = 1; for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; } for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; })();
    function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }
    function rsGen(n) { var g = [1]; for (var i = 0; i < n; i++) { var ng = []; for (var j = 0; j <= g.length; j++) ng[j] = (j < g.length ? g[j] : 0) ^ (j > 0 ? gmul(g[j - 1], EXP[i]) : 0); g = ng; } return g; }
    function rsEnc(data, n) {
      var g = rsGen(n), r = []; for (var i = 0; i < n; i++) r[i] = 0;
      data.forEach(function (b) { var f = b ^ r.shift(); r.push(0); for (var i = 0; i < n; i++) r[i] ^= gmul(g[i + 1], f); });
      return r;
    }

    if (num.length <= 11) num = '55' + num;
    var ex = extras();
    var msg = (C.mensagemWhatsapp || 'Olá! Já fiz a seleção das fotos.') + '\n\n' + titulo() + '\nFotos selecionadas: ' + SEL.size + (ex ? '\nExtras: ' + ex + (C.precoExtra > 0 ? ' (' + brl(ex * C.precoExtra) + ')' : '') + (valorACobrar() > 0 ? '\nValor dos extras a pagar: ' + brl(valorACobrar()) : '') : '') + (PAGO && PAGO.recibo ? '\nComprovante: ' + PAGO.recibo : '');
    return 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
  }

  // ---------------------------------------------------------------- pagamento das fotos extras (QR Code + contador)
  function pixTexto(s, max) {
    s = String(s || ''); try { s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) { }
    return s.replace(/[^A-Za-z0-9 .\-]/g, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '').toUpperCase().slice(0, max);
  }
  function cpfOk(d) {
    if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
    for (var t = 9; t < 11; t++) { var s = 0; for (var i = 0; i < t; i++) s += Number(d.charAt(i)) * (t + 1 - i); if (((s * 10) % 11) % 10 !== Number(d.charAt(t))) return false; }
    return true;
  }
  // formato da chave dentro do QR Code Pix: CPF/CNPJ só números, celular +55..., e-mail e aleatória em minúsculas
  function pixChaveEmv(chave, tipo) {
    var c = String(chave || '').replace(/^\s+|\s+$/g, ''), d = c.replace(/\D/g, ''); tipo = String(tipo || 'auto');
    if (tipo === 'auto') {
      if (c.indexOf('@') > 0) tipo = 'email';
      else if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(c)) tipo = 'evp';
      else if (c.charAt(0) === '+') tipo = 'tel';
      else if (d.length === 14) tipo = 'cnpj';
      else if (d.length === 11) tipo = (/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(c) || cpfOk(d)) ? 'cpf' : 'tel';
      else if (d.length >= 10 && d.length <= 13) tipo = 'tel';
      else tipo = 'evp';
    }
    if (tipo === 'email' || tipo === 'evp') return c.toLowerCase();
    if (tipo === 'cpf' || tipo === 'cnpj') return d;
    if (tipo === 'tel') return (c.charAt(0) === '+' || d.length >= 12) ? '+' + d : '+55' + d;
    return c;
  }
  function emv(id, v) { v = String(v); return id + (v.length < 10 ? '0' : '') + v.length + v; }
  function crc16(s) {
    var crc = 0xFFFF;
    for (var i = 0; i < s.length; i++) { crc ^= s.charCodeAt(i) << 8; for (var j = 0; j < 8; j++) crc = (crc & 0x8000) ? (((crc << 1) ^ 0x1021) & 0xFFFF) : ((crc << 1) & 0xFFFF); }
    return ('000' + crc.toString(16).toUpperCase()).slice(-4);
  }
  // "Pix copia e cola" com valor (padrão do Banco Central) - qualquer banco lê
  function pixBrCode(chave, tipo, valor, nome, cidade) {
    var conta = emv('00', 'br.gov.bcb.pix') + emv('01', pixChaveEmv(chave, tipo));
    var p = emv('00', '01') + emv('01', '11') + emv('26', conta) + emv('52', '0000') + emv('53', '986') + (valor > 0 ? emv('54', valor.toFixed(2)) : '') +
      emv('58', 'BR') + emv('59', pixTexto(nome, 25) || 'RECEBEDOR') + emv('60', pixTexto(cidade, 15) || 'BRASIL') + emv('62', emv('05', '***')) + '6304';
    return p + crc16(p);
  }

  // Depois de pagar, a InfinitePay devolve o cliente para a galeria (com ?receipt_url=...&transaction_nsu=...)
  function urlRetorno() {
    try { if (location.protocol !== 'https:') return ''; return location.origin + location.pathname + '?' + (TC ? 'c=' + encodeURIComponent(TC) + '&' : '') + 'g=' + encodeURIComponent(TG); } catch (e) { return ''; }
  }
  function pagoRetorno() {
    if (!PAGO) return;
    if (!D || C.finalizada) { PAGO = null; return; }
    var v = valorACobrar();
    abrirModal('<h3>Pagamento recebido ✓</h3><p>Obrigado! Agora é só enviar a sua seleção ao fotógrafo.</p><div class="sum"><div><span>Fotos selecionadas</span><b>' + SEL.size + '</b></div>' +
      (v > 0 ? '<div><span>Extras pagas</span><b>' + brl(v) + '</b></div>' : '') + '</div>' +
      '<div class="rowb"><button class="btn sec" data-a="mfechar">Depois</button><button class="btn" data-a="confirmar">Confirmar e enviar</button></div>');
  }

  var PG = { t: 0, fim: 0, valor: 0, modo: '', url: '', br: '', usado: '', expirou: false };
  function pgModo() {
    var m = String(C.pagamentoModo || 'auto').toLowerCase(), ip = !!String(C.infinitePay || '').replace(/\s/g, ''), px = !!String(C.pixChave || '').replace(/\s/g, '');
    if (m === 'chave') return 'chave';
    if (m === 'infinitepay' && ip) return 'infinitepay';
    if (m === 'pix' && px) return 'pix';
    return ip ? 'infinitepay' : (px ? 'pix' : 'chave');
  }
  function pgMin() { var m = Number(C.pagamentoMinutos); return (m >= 1 && m <= 60) ? Math.floor(m) : 10; }
  function mmss(ms) { var s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60); s = s % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function pgParar() { clearInterval(PG.t); PG.t = 0; }
  function pgTem() { return pgModo() !== 'chave' || !!(C.pixChave || C.pixInfo || C.pixQr); }

  function pgHtml(valor) {
    var modo = pgModo(), h = '<div class="pg" id="pg"><div class="pgh"><b>Pagamento das fotos extras</b>' +
      (modo !== 'chave' ? '<span class="pgt" id="pgt">' + mmss(pgMin() * 60000) + '</span>' : '') + '</div><div class="pgv">' + brl(valor) + '</div>';
    if (modo !== 'chave') {
      h += '<div class="pgq" id="pgq"><div class="ld"><div class="spin"></div>Gerando QR Code…</div></div><div class="pga" id="pga"></div>' +
        '<div class="pgd">Abra o app do seu banco, escolha pagar com QR Code e aponte a câmera. No celular, use o botão acima. Depois de pagar, toque em <b>Confirmar e enviar</b>.</div>';
    } else if (C.pixQr) {
      h += '<div class="pgq"><img src="/api/pix-qr?v=' + Date.now() + '" alt="QR Code Pix" style="width:190px;max-width:70vw;background:#fff;padding:6px;border-radius:10px"></div>';
    }
    if (C.pixChave) h += '<div class="pgk"><b>Chave Pix</b><code>' + esc(C.pixChave) + '</code><button class="btn sec" data-a="copiapix" style="padding:8px 14px">Copiar chave</button>' + (C.pixInfo ? '<pre>' + esc(C.pixInfo) + '</pre>' : '') + '</div>';
    else if (C.pixInfo) h += '<div class="pgk"><pre>' + esc(C.pixInfo) + '</pre></div>';
    return h + '</div>';
  }

  function pgTick() {
    if (!document.getElementById('pg')) { pgParar(); return; }
    var el = document.getElementById('pgt'), resta = PG.fim - Date.now();
    if (resta <= 0) {
      pgParar(); PG.expirou = true;
      if (el) { el.textContent = '00:00'; el.className = 'pgt low'; }
      var q = document.getElementById('pgq'), a = document.getElementById('pga');
      if (q) q.innerHTML = '<div class="pgx"><b>Tempo esgotado</b><br>O QR Code expirou. Gere um novo para pagar.</div>';
      if (a) a.innerHTML = '<button class="btn" data-a="pgnovo">Gerar novo QR Code</button>';
      return;
    }
    if (el) { el.textContent = mmss(resta); el.className = 'pgt' + (resta < 60000 ? ' low' : ''); }
  }
  function pgPintar(txt, acoes) {
    var q = document.getElementById('pgq'), a = document.getElementById('pga');
    if (!q || PG.expirou || Date.now() >= PG.fim) return;
    try { q.innerHTML = PFQR.svg(txt, 'M'); } catch (e) { q.innerHTML = '<div class="pgx">Não consegui desenhar o QR Code. Use a chave Pix abaixo.</div>'; }
    // tamanho em múltiplo exato dos quadradinhos: o QR fica nítido e a câmera lê mais rápido
    try { var sv = q.querySelector('svg'), mod = sv.viewBox.baseVal.width, mx = Math.min(240, Math.floor(window.innerWidth * 0.7)); sv.style.width = Math.max(mod * 3, Math.floor(mx / mod) * mod) + 'px'; } catch (e) { }
    if (a) a.innerHTML = acoes;
  }
  function pgErro(msg) { var q = document.getElementById('pgq'); if (q) q.innerHTML = '<div class="pgx">' + esc(msg) + '</div>'; var a = document.getElementById('pga'); if (a) a.innerHTML = ''; }

  function pgGerar(valor, modo) {
    var meu = PG;
    function viaPix() {
      if (meu !== PG) return;
      if (!String(C.pixChave || '').replace(/\s/g, '')) { pgErro('Não consegui gerar o QR Code agora. Fale com o fotógrafo para combinar o pagamento.'); return; }
      try { meu.br = pixBrCode(C.pixChave, C.pixTipo, valor, C.pixNome, C.pixCidade); meu.usado = 'pix'; }
      catch (e) { pgErro('Não consegui gerar o QR Code. Use a chave Pix abaixo.'); return; }
      pgPintar(meu.br, '<button class="btn" data-a="copiabr">Copiar Pix copia e cola</button>');
    }
    if (modo === 'pix') { viaPix(); return; }
    getJson('/api/galeria/pagamento' + qg(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ valor: valor, descricao: titulo(), retorno: urlRetorno() }) })
      .then(function (r) {
        if (meu !== PG) return;
        var u = String((r && r.url) || '');
        if (!/^https:\/\/([a-z0-9-]+\.)*infinitepay\.io\//i.test(u)) throw new Error('link');
        meu.url = u; meu.usado = 'infinitepay';
        pgPintar(u, '<a class="btn" target="_blank" rel="noopener" href="' + esc(u) + '">Abrir pagamento</a>');
      })
      .catch(function () { viaPix(); });   // InfinitePay indisponível: cai para o QR do Pix
  }

  function pgIniciar(novo) {
    pgParar();
    var modo = pgModo(); if (modo === 'chave') return;
    var valor = valorACobrar(), sessao = 'pf_pg_' + (TG || TC || 'x') + '_' + valor.toFixed(2), fim = 0;
    if (!novo) { try { fim = Number(sessionStorage.getItem(sessao)) || 0; } catch (e) { } }   // reabrir o resumo não reinicia o contador
    if (!fim) { fim = Date.now() + pgMin() * 60000; try { sessionStorage.setItem(sessao, String(fim)); } catch (e) { } }
    PG = { t: 0, fim: fim, valor: valor, modo: modo, url: '', br: '', usado: '', expirou: false };
    var q = document.getElementById('pgq'); if (q) q.innerHTML = '<div class="ld"><div class="spin"></div>Gerando QR Code…</div>';
    var a = document.getElementById('pga'); if (a) a.innerHTML = '';
    PG.t = setInterval(pgTick, 1000); pgTick();
    if (!PG.expirou) pgGerar(valor, modo);
  }

  function modalFinalizar() {
    var ex = extras(), pr = preco(), inc = incl(), cobrar = valorACobrar(), ja = extrasJaEnviadas();
    var h = '<h3>Finalizar seleção</h3><p>Confira o resumo antes de enviar ao fotógrafo.</p><div class="sum">' +
      '<div><span>Fotos selecionadas</span><b>' + SEL.size + '</b></div>' + (C.reaberta ? '<div><span>Já enviadas antes</span><b>' + ENV.size + '</b></div><div><span>Novas nesta rodada</span><b>' + novasSel() + '</b></div>' : '') + (inc ? '<div><span>Incluídas no pacote</span><b>' + inc + '</b></div>' : '') +
      (ex ? '<div><span>Fotos extras' + (pr > 0 ? ' (' + brl(pr) + ' cada)' : '') + '</span><b>' + ex + '</b></div>' : '') +
      (ja ? '<div><span>Extras já cobradas antes</span><b>' + ja + '</b></div>' : '') +
      (cobrar > 0 ? '<div class="tot"><span>Total a pagar</span><span>' + brl(cobrar) + '</span></div>' : '') + '</div>';
    var mostrar = cobrar > 0 && pgTem();
    if (mostrar) h += pgHtml(cobrar);
    h += '<div class="rowb fix"><button class="btn sec" data-a="mfechar">Voltar</button><button class="btn" data-a="confirmar">Confirmar e enviar</button></div>';
    abrirModal(h);
    if (mostrar && pgModo() !== 'chave') pgIniciar(false);
  }

  var finalizando = false;
  function confirmarFinalizacao() {
    if (finalizando) return; finalizando = true;
    var bt = mo.querySelector('[data-a="confirmar"]'), tx = bt ? bt.textContent : '';
    if (bt) { bt.textContent = 'Enviando…'; bt.classList.add('busy'); }
    var wa = waLink();   // antes de atualizar o que já foi enviado, para o recado levar o valor certo
    getJson('/api/galeria/finalizar' + qg(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ selecionadas: Array.from(SEL) }) })
      .then(function () {
        pgParar();
        C.finalizada = true; C.finalizadaEm = new Date().toLocaleString('pt-BR');
        if (C.reaberta) ENV = new Set(Array.from(SEL));
        abrirModal('<h3>Seleção enviada! ✓</h3><p>Suas ' + SEL.size + ' fotos foram enviadas para o fotógrafo.' + (wa ? ' Avise pelo WhatsApp para agilizar.' : '') + '</p>' +
          '<div class="rowb"><button class="btn sec" data-a="mfechar">Fechar</button>' + (wa ? '<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="' + wa + '">Avisar pelo WhatsApp</a>' : '') + '</div>');
        desenharGaleria();
      })
      .catch(function () { toast('Não foi possível enviar. Tente novamente.'); if (bt) { bt.textContent = tx; bt.classList.remove('busy'); } })
      .then(function () { finalizando = false; });
  }

    // ------------------------------------------------------------------ eventos
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.getAttribute('data-a'), n = el.getAttribute('data-n');
    if (a === 'ver') { if (e.target.closest('.rb')) return; abrirLightbox(Number(el.getAttribute('data-i'))); return; }
    e.stopPropagation();
    if (a === 'tema') trocarTema();
    else if (a === 'sel' || a === 'fav') alternar(n, a);
    else if (a === 'com') { if (LBI >= 0) { /* mantém o lightbox por baixo */ } modalComentario(n); }
    else if (a === 'enviarcom') enviarComentario(n);
    else if (a === 'mfechar') fecharModal();
    else if (a === 'filtro') { FILTRO = el.getAttribute('data-k'); atualizarChrome(); redesenharGrade(); }
    else if (a === 'pasta') { var kp = el.getAttribute('data-k'); PASTA = kp === '' ? '' : (D.pastas[Number(kp)] || ''); atualizarChrome(); redesenharGrade(); }
    else if (a === 'finalizar') modalFinalizar();
    else if (a === 'confirmar') confirmarFinalizacao();
    else if (a === 'copiapix') copiarTexto(C.pixChave || '', 'Chave Pix copiada.');
    else if (a === 'copiabr') copiarTexto(PG.br || '', 'Código Pix copiado. Cole no app do seu banco.');
    else if (a === 'pgnovo') pgIniciar(true);
    else if (a === 'lbfechar') fecharLightbox();
    else if (a === 'lbant') lbMover(-1);
    else if (a === 'lbprox') lbMover(1);
    else if (a === 'abrir') { TG = PORTAL.galerias[Number(el.getAttribute('data-i'))].token; history.pushState({}, '', '?c=' + encodeURIComponent(TC) + '&g=' + encodeURIComponent(TG)); window.scrollTo(0, 0); verGaleria(); }
    else if (a === 'voltar') { TG = ''; history.pushState({}, '', '?c=' + encodeURIComponent(TC)); verPortal(); }
    else if (a === 'fechaaviso') { dispensar(el.getAttribute('data-id')); desenharPortal(); }
  });
  mo.addEventListener('click', function (e) { if (e.target === mo) fecharModal(); });
  // no celular, tocar em Enviar com o teclado aberto tirava o foco da caixa e a tela pulava: segura o foco
  mo.addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('[data-a="enviarcom"],[data-a="confirmar"]')) e.preventDefault(); });
  window.addEventListener('popstate', function () { if (ignorarPop > 0) { ignorarPop--; return; } if (modalPush) { modalPush = false; mo.className = 'mo'; mo.innerHTML = ''; return; } if (LBI >= 0) { fecharVisual(); return; } P = new URLSearchParams(location.search); TC = P.get('c') || ''; TG = P.get('g') || ''; rotear(); });

  function rotear() {
    fecharVisual(); fecharModal();
    if (TG) verGaleria();
    else if (TC) verPortal();
    else verGaleria(); // link antigo (/galeria): abre a galeria em edição
  }
  rotear();
})();
</script>
